name: Deploy to Vercel

on:
  push:
    branches:
      - Matendo  # main branch name
    paths:
      - 'matendo_health/**'  # only trigger on changes to Laravel app
  pull_request:
    branches:
      - Matendo
    paths:
      - 'matendo_health/**'

defaults:
  run:
    working-directory: matendo_health  # set default working directory

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install PlanetScale CLI
        working-directory: /tmp  # Override working directory for global installation
        run: |
          curl -fsSL https://github.com/planetscale/cli/releases/download/v0.150.0/pscale_0.150.0_linux_amd64.deb -o pscale.deb
          sudo dpkg -i pscale.deb
          rm pscale.deb

      - name: Setup PlanetScale CLI
        uses: planetscale/setup-pscale-action@v1
        with:
          pscale_version: 'v0.150.0'

      - name: Setup PlanetScale Database
        env:
          PLANETSCALE_TOKEN: ${{ secrets.PLANETSCALE_TOKEN }}
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
        run: |
          # Authenticate with PlanetScale using environment variables
          export PLANETSCALE_SERVICE_TOKEN="$PLANETSCALE_TOKEN"
          export PLANETSCALE_SERVICE_TOKEN_ID="$PLANETSCALE_ORG"

          # Check if database exists, create if it doesn't
          if ! pscale database list --format json | jq -r '.[].name' | grep -q '^matendo_health$'; then
            pscale database create matendo_health --region eu-west
          fi

          # Create or switch to deploy branch
          if ! pscale branch list matendo_health --format json | jq -r '.[].name' | grep -q '^deploy$'; then
            pscale branch create matendo_health deploy
          fi

          # Get database credentials
          CREDS=$(pscale password create matendo_health deploy --format json)

          # Set database environment variables
          echo "DB_HOST=$(echo $CREDS | jq -r '.host')" >> $GITHUB_ENV
          echo "DB_PORT=$(echo $CREDS | jq -r '.port')" >> $GITHUB_ENV
          echo "DB_USERNAME=$(echo $CREDS | jq -r '.username')" >> $GITHUB_ENV
          echo "DB_PASSWORD=$(echo $CREDS | jq -r '.password')" >> $GITHUB_ENV
          echo "DB_DATABASE=matendo_health" >> $GITHUB_ENV

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Generate Application Key
        run: |
          php artisan key:generate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          MYSQL_ATTR_SSL_CA: /etc/pki/tls/certs/ca-bundle.crt
        run: php artisan migrate --force

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Update Vercel environment variables with database credentials
          vercel env add DB_HOST $DB_HOST --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add DB_PORT $DB_PORT --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add DB_USERNAME $DB_USERNAME --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add DB_PASSWORD $DB_PASSWORD --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add DB_DATABASE matendo_health --token=${{ secrets.VERCEL_TOKEN }}
          
          npm i -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
