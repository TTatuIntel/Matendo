# =====================================================================
# Apache 2.4 vhost for matendohealth.com
# Save as: /etc/apache2/sites-available/matendohealth.conf
# Enable:  sudo a2ensite matendohealth && sudo systemctl reload apache2
# Then run certbot to add the HTTPS block automatically:
#          sudo certbot --apache -d matendohealth.com -d www.matendohealth.com
# =====================================================================

<VirtualHost *:80>
    ServerName  matendohealth.com
    ServerAlias www.matendohealth.com
    ServerAdmin info@matendohealth.com

    DocumentRoot /var/www/matendohealth

    <Directory /var/www/matendohealth>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to sensitive folders even if .htaccess fails to load.
    <DirectoryMatch "^/var/www/matendohealth/(config|includes|sql|storage|deploy|\.git)">
        Require all denied
    </DirectoryMatch>

    # Block .env at the filesystem level too.
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/matendohealth-error.log
    CustomLog ${APACHE_LOG_DIR}/matendohealth-access.log combined

    # certbot will append a <VirtualHost *:443> block below this one
    # and add a redirect from :80 → :443 automatically.
</VirtualHost>
