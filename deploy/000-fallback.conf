# =====================================================================
# 000-fallback — explicit catch-all for unmatched hostnames.
# =====================================================================
#
# Why this file exists:
#   Apache picks an implicit default vhost when a request's Host header
#   doesn't match any ServerName/ServerAlias. By default that's whatever
#   vhost loads first alphabetically — easy to get wrong on a server
#   that hosts multiple apps. This file is named "000-" so it loads
#   first and BECOMES the default, returning a plain 404 for any domain
#   that isn't explicitly configured.
#
#   Effect: Matendo (or any other app) can never be silently promoted
#   to "site shown for every domain on this IP" again.
#
# Install:
#   sudo cp /var/www/Matendo/deploy/000-fallback.conf \
#           /etc/apache2/sites-available/000-fallback.conf
#   sudo a2ensite 000-fallback.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
#   You can also keep the stock 000-default.conf and disable this — but
#   only one of them should be enabled.
# =====================================================================

<VirtualHost *:80>
    ServerName  fallback.invalid
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Require all denied
    </Directory>

    # Any unmatched host gets a plain 404, nothing else.
    RedirectMatch 404 ^/.*$

    ErrorLog  ${APACHE_LOG_DIR}/fallback-error.log
    CustomLog ${APACHE_LOG_DIR}/fallback-access.log combined
</VirtualHost>
