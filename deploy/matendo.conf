# =====================================================================
# Matendo Health — Apache vhost (HTTP only; certbot adds the :443 block)
# =====================================================================
#
# IMPORTANT — coexistence rules for shared servers:
#
#   1. ServerName MUST be set. Without it, Apache treats the FIRST
#      <VirtualHost *:80> in alphabetical config order as the implicit
#      default for every domain that lands on the IP. That is exactly
#      what made hosu.or.ug (and every other site on the box) start
#      serving Matendo.
#
#   2. ServerAlias must list ONLY the hostnames Matendo should answer
#      for. Do NOT add a wildcard.
#
#   3. Keep 000-default.conf enabled, OR ship a tiny "fallback" vhost
#      that returns 404 for unmatched hostnames. Otherwise Apache will
#      pick whichever real vhost loads first as the catch-all again.
#
# Install:
#   sudo cp /var/www/Matendo/deploy/matendo.conf \
#           /etc/apache2/sites-available/matendo.conf
#   # edit ServerName/ServerAlias for YOUR domain, then:
#   sudo a2ensite matendo.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# =====================================================================

<VirtualHost *:80>
    # --- Change these two lines to match the domain Matendo serves. ---
    ServerName  matendohealth.com
    ServerAlias www.matendohealth.com

    DocumentRoot /var/www/Matendo

    <Directory /var/www/Matendo>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Lock down sensitive folders even if .htaccess is ever disabled.
    <DirectoryMatch "^/var/www/Matendo/(config|includes|sql|storage|deploy)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/matendo-error.log
    CustomLog ${APACHE_LOG_DIR}/matendo-access.log combined
</VirtualHost>
